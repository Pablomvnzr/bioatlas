name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Hosted runners also update kernels on pinned Ubuntu images.
    runs-on: ubuntu-24.04
    services:
      mongo:
        # Test the supported MongoDB 7 baseline until SERVER-136848 is fixed
        # in an available official MongoDB 8 image. Atlas remains on MongoDB 8.
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bioatlas
          POSTGRES_PASSWORD: bioatlas_ci
          POSTGRES_DB: bioatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioatlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bioatlas:bioatlas_ci@localhost:5432/bioatlas
      MONGODB_URI: mongodb://127.0.0.1:27017/bioatlas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: node apps/api/scripts/migrate.ts
      - run: pnpm test
      - run: docker build -t bioatlas-api:check .
