name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: bioatlas
          POSTGRES_PASSWORD: bioatlas_ci
          POSTGRES_DB: bioatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioatlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bioatlas:bioatlas_ci@localhost:5432/bioatlas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: node apps/api/scripts/migrate.ts
      - run: pnpm test
