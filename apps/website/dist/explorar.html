<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avistamientos · BioAtlas</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="leaflet/leaflet.css"><style>#map{height:clamp(300px,55vh,620px);background:#e3ebdd}main{padding:40px 5%}form{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}input{padding:14px;border:1px solid #899477;background:transparent;font:inherit;min-width:0}button{padding:12px 25px;background:#233b2b;color:white;border:0;cursor:pointer}.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.record{border-top:1px solid #cdd0be;padding:20px 0}.record p{font-size:14px}.catalog-controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}.catalog-controls label{display:flex;align-items:center;gap:8px}.record .origin{color:#245c50;font-weight:700}</style></head><body><header><a class="brand" href="index.html">BioAtlas<small> / ATLAS PÚBLICO</small></a><a href="index.html">Volver al inicio</a></header><main><p class="eyebrow">BIOTOPOS DE VALDIVIA</p><h1>Lo que otros<br>han <em>observado.</em></h1><p>Explora los registros públicos de Valdivia y los avistamientos de la comunidad. Los enviados desde la app aparecen después de su aprobación.</p><div id="map" role="region" aria-label="Mapa interactivo de los biotopos de Valdivia"></div><form id="search"><input id="query" aria-label="Nombre de especie" placeholder="Busca una especie…" maxlength="100"><button>Buscar</button></form><div class="catalog-controls"><label><input id="community" type="checkbox"> Solo registros de la comunidad</label><button id="refresh" type="button">Actualizar registros</button></div><p id="status" role="status"></p><button id="retry" hidden>Volver a intentar</button><div class="records" id="records"></div><button id="more" hidden>Cargar más</button></main><script src="leaflet/leaflet.js"></script><script type="module" src
