services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: bioatlas
      POSTGRES_PASSWORD: bioatlas_local
      POSTGRES_DB: bioatlas
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bioatlas_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bioatlas']
      interval: 5s
      timeout: 3s
      retries: 15
  mongo:
    image: mongo:8.0
    profiles: ['media']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - bioatlas_mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  bioatlas_db:
  bioatlas_mongo:
